<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGRILEASE – Renting Agricultural Equipments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--gold:#f3b933;--ink:#f4f7ee;--mut:#c4d3c0;--glass:rgba(255,255,255,.13);--line:rgba(255,255,255,.26);--red:#ff8d7e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font:15px/1.5 Figtree,system-ui,sans-serif;color:var(--ink);background:#0c2f1c}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0;letter-spacing:-.01em}
.bg{position:fixed;inset:0;background-size:cover;background-position:center;filter:blur(7px) brightness(.74) saturate(1.1);transform:scale(1.06);z-index:-2}
.ov{position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,rgba(8,36,20,.55),rgba(8,36,20,.2))}
.gl{background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);border:1px solid var(--line);border-radius:18px;box-shadow:0 8px 32px rgba(0,0,0,.22)}
.app{min-height:100vh}
.side{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));width:244px;z-index:30;display:flex;flex-direction:column;padding:16px;transition:transform .25s;background:rgba(14,46,28,.55)}
.side .brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.side .brand img{width:44px;height:44px;border-radius:12px;object-fit:cover}
.side .brand b{font:800 19px "Bricolage Grotesque";display:block;line-height:1.1}
.side .brand small{color:var(--mut);font-size:11px}
.side nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:4px}
.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--ink);background:none;border:0;font:inherit;cursor:pointer;text-align:left;width:100%}
.nv:hover{background:rgba(255,255,255,.1)}
.nv.on{background:rgba(243,185,51,.9);color:#2a2306;font-weight:600}
.nv .n{margin-left:auto;background:var(--gold);color:#2a2306;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.nv.on .n{background:#2a2306;color:var(--gold)}
.main{margin-left:268px;padding:12px 16px 40px;max-width:1280px}
.top{position:sticky;top:calc(8px + env(safe-area-inset-top,0px));z-index:20;display:flex;gap:10px;align-items:center;padding:10px 14px;margin-bottom:16px}
.top h2{font-size:20px;flex:1}
.hb{display:none;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer}
.sc{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25}
.ib{position:relative;display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer}
.ib .n{position:absolute;top:-5px;right:-5px;background:var(--gold);color:#2a2306;border-radius:99px;font-size:11px;font-weight:700;padding:0 6px}
.chip{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:99px;border:1px solid var(--line);background:rgba(255,255,255,.1);font-size:13px}
.chip i{width:28px;height:28px;border-radius:50%;background:var(--gold);color:#2a2306;display:grid;place-items:center;font-style:normal;font-weight:700}
.chip small{display:block;color:var(--mut);text-transform:capitalize;line-height:1}
.net{display:flex;align-items:center;gap:6px;padding:0 12px;width:auto;font-size:13px}
.net.off{background:rgba(255,141,126,.25);border-color:var(--red)}
.banner{padding:10px 14px;margin-bottom:14px;border-radius:14px;display:flex;gap:10px;align-items:center;background:rgba(243,185,51,.2);border:1px solid rgba(243,185,51,.6)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.stg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.st{padding:14px;display:flex;flex-direction:column;gap:2px}
.st .ic{color:var(--gold);margin-bottom:4px}
.st b{font:700 26px "Bricolage Grotesque"}
.st span{color:var(--mut);font-size:13px}
.card{padding:16px}
.sec{margin-bottom:18px}
.sec>h3{margin:0 0 10px;font-size:17px}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar>*{flex:1;min-width:150px}.bar .bt{flex:0 0 auto}
.eq{overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s}
.eq:hover{transform:translateY(-3px)}
.eq .im{height:130px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(63,163,77,.5),rgba(243,185,51,.3));color:#fff}
.eq .im img{width:100%;height:100%;object-fit:cover}
.eq .bd{padding:14px;display:flex;flex-direction:column;gap:6px;flex:1}
.eq h3{font-size:17px}.mut{color:var(--mut);font-size:13px}
.pr{font:700 18px "Bricolage Grotesque";color:var(--gold)}
.meta{display:flex;gap:6px;align-items:center;color:var(--mut);font-size:13px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:12px;border:0;background:var(--gold);color:#2a2306;font:600 14px Figtree;cursor:pointer}
.bt:hover{filter:brightness(1.08)}.bt:disabled{opacity:.5;cursor:not-allowed}
.bt.s{background:rgba(255,255,255,.14);color:var(--ink);border:1px solid var(--line)}
.bt.g{background:#46b05a;color:#04210f}.bt.d{background:rgba(255,141,126,.9);color:#3a0b04}
.bt.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);font:inherit}
select option{background:#14301f;color:#fff}::placeholder{color:#b7c6b3}
textarea{min-height:70px;resize:vertical}
input[type=file]{padding:8px}
.f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:13.5px}.f>span{color:var(--mut)}
.er{color:var(--red)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;text-transform:capitalize;background:rgba(255,255,255,.18)}
.b.pending{background:rgba(243,185,51,.3);color:#ffe29a}.b.approved,.b.active,.b.available,.b.ok{background:rgba(70,176,90,.35);color:#c9f5d0}
.b.ongoing{background:rgba(90,160,255,.3);color:#cfe2ff}.b.completed{background:rgba(60,200,190,.3);color:#c4f5f0}
.b.rejected,.b.inactive,.b.err,.b.unavailable{background:rgba(255,141,126,.3);color:#ffd1ca}.b.cancelled,.b.archived{background:rgba(200,200,200,.25);color:#e4e4e4}
.tw{overflow-x:auto;padding:6px 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;color:var(--mut);font-weight:600;padding:10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid rgba(255,255,255,.1);vertical-align:middle}
tr:last-child td{border-bottom:0}
.em{text-align:center;color:var(--mut);padding:26px 0}
.pg{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 0 4px}
.pg button{min-width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:var(--ink);cursor:pointer;padding:0 10px}
.pg button.on{background:var(--gold);color:#2a2306;font-weight:700}.pg button:disabled{opacity:.4;cursor:not-allowed}
.pg span{color:var(--mut);font-size:13px;margin-left:8px}
.mo{position:fixed;inset:0;background:rgba(5,20,12,.6);display:grid;place-items:center;z-index:50;padding:14px;overflow:auto}
.md{width:min(640px,100%);max-height:92vh;overflow:auto;padding:20px;background:rgba(20,48,32,.8)}
.md>header{display:flex;align-items:center;margin-bottom:14px}.md>header h3{flex:1}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:14px;margin-bottom:12px}.kv dt{color:var(--mut)}.kv dd{margin:0}
.est{padding:12px;border-radius:12px;background:rgba(243,185,51,.16);border:1px solid rgba(243,185,51,.5);margin-bottom:12px}
.doc{display:grid;place-items:center;min-height:110px;border:1px dashed var(--line);border-radius:12px;padding:8px;margin-bottom:10px;color:var(--mut);font-size:13px;text-align:center}
.doc img{max-width:100%;max-height:200px;border-radius:8px}
.toasts{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:90;display:flex;flex-direction:column;gap:8px;max-width:calc(100% - 28px)}
.ts{padding:11px 16px;border-radius:12px;background:rgba(14,46,28,.92);border:1px solid var(--line);box-shadow:0 6px 24px rgba(0,0,0,.35);max-width:360px}
.ts.err{border-color:var(--red)}
.au{min-height:100vh;display:grid;place-items:center;padding:20px}
.au .c{width:min(480px,100%);padding:26px}
.lg{display:block;width:120px;height:122px;object-fit:cover;border-radius:22px;margin:0 auto 12px;box-shadow:0 6px 22px rgba(0,0,0,.35)}
.tabs{display:flex;gap:6px;margin-bottom:16px;padding:4px;border-radius:14px;background:rgba(0,0,0,.2)}
.tabs button{flex:1;padding:9px;border-radius:10px;border:0;background:none;color:var(--ink);font:600 14px Figtree;cursor:pointer}
.tabs button.on{background:var(--gold);color:#2a2306}
.demo{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.chat{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - 150px);min-height:420px;overflow:hidden}
.cl{border-right:1px solid var(--line);overflow:auto;padding:8px}
.cl button{display:flex;width:100%;gap:10px;align-items:center;padding:10px;border-radius:12px;border:0;background:none;color:var(--ink);cursor:pointer;text-align:left;font:inherit}
.cl button.on,.cl button:hover{background:rgba(255,255,255,.14)}
.ct{display:flex;flex-direction:column;min-width:0}
.ch{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.cm{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:8px}
.mg{max-width:78%;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.16);align-self:flex-start;word-wrap:break-word}
.mg.me{align-self:flex-end;background:rgba(243,185,51,.9);color:#2a2306}
.mg small{display:block;font-size:11px;opacity:.7;margin-top:2px}
.cf{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.back{display:none}button.chip{font:inherit;color:var(--ink);cursor:pointer}button.chip:hover{background:rgba(255,255,255,.2)}.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;margin-bottom:18px}.cg h3{font-size:16px;margin-bottom:8px}.pie{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.pie svg{width:150px;height:150px;flex:none}.pie ul{list-style:none;margin:0;padding:0;font-size:13px;display:grid;gap:4px}.pie li i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
@media(max-width:900px){.side{transform:translateX(-120%)}.side.open{transform:none}.main{margin-left:0;padding:8px 10px 40px}.hb{display:grid}.sc.open{display:block}.chip div{display:none}.chip{padding:5px}}
@media(max-width:700px){
 .chat{grid-template-columns:1fr}.chat.open .cl{display:none}.chat:not(.open) .ct{display:none}.back{display:inline-grid}
 .fr{grid-template-columns:1fr}.net span{display:none}.net{width:40px;padding:0;justify-content:center}
 thead{display:none}table,tbody,tr,td{display:block;width:100%}
 tr{padding:8px 4px;border-bottom:1px solid var(--line)}td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 8px;text-align:right}
 td:before{content:attr(data-l);color:var(--mut);text-align:left;flex-shrink:0}
 .top h2{font-size:17px}.kv{grid-template-columns:100px 1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.np{position:fixed;top:calc(78px + env(safe-area-inset-top,0px));right:20px;width:min(380px,calc(100% - 16px));max-height:72vh;overflow:auto;z-index:40;padding:12px;background:rgba(14,46,28,.95)}.np>header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.ni{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;padding:10px;border-radius:12px;border:0;border-bottom:1px solid rgba(255,255,255,.1);background:none;color:var(--ink);font:inherit;cursor:pointer}.ni:hover{background:rgba(255,255,255,.1)}.ni.un{background:rgba(243,185,51,.14);border-left:3px solid var(--gold)}.ni span{color:var(--mut);font-size:13px}.ni small{color:var(--mut);font-size:11px}@media(max-width:700px){.np{left:8px;right:8px;width:auto}}.eq{height:100%}.eq .im{position:relative;display:block;height:160px;flex:none;overflow:hidden}.eq .im img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.eq .im svg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}.eq h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em;line-height:1.25}.eq .bd>.mut,.eq .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.qrb{display:block;background:#fff;padding:8px;border-radius:12px;width:200px;height:200px;margin:0 auto 8px;object-fit:contain}.qrb svg{width:100%;height:100%;display:block}.upb{display:grid;gap:6px;align-content:start}.drop{display:grid;place-items:center;gap:4px;padding:18px 10px;border:2px dashed rgba(255,255,255,.4);border-radius:14px;text-align:center;cursor:pointer;background:rgba(255,255,255,.07)}.drop:hover{background:rgba(255,255,255,.14)}.drop input{display:none}.drop small{color:var(--mut)}.upb .doc img{max-height:150px;width:100%;object-fit:contain}.bar label{display:flex;align-items:center;gap:6px;font-size:13px}.bar input[type=date]{width:100%;min-width:0}.bar label{flex:1 1 150px;min-width:0}.nsc{position:fixed;inset:0;z-index:35;background:transparent}</style>
</head>
